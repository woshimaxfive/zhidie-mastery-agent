name: 缺陷报告
description: 报告可复现的功能、界面或接口问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。提交前请移除密钥、个人信息、数据库内容和其他敏感数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及它对使用造成的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 打开……
        3. 输入……
        4. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供操作系统、Python、Node.js、pnpm 和浏览器版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的日志或截图
      description: 请勿粘贴密钥、个人信息、完整数据库或未经脱敏的请求内容。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认现有 Issue 中没有相同问题。
          required: true
        - label: 我已移除所有敏感信息。
          required: true
